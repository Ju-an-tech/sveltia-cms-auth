name = "sveltia-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"

# Workers Builds deploys this repo with `wrangler deploy`, which treats this
# file as the source of truth for bindings. Non-secret configuration therefore
# lives here; anything set only in the dashboard is dropped on deploy unless
# keep_vars is on, which is what wiped GITHUB_CLIENT_ID and ALLOWED_DOMAINS.
# GITHUB_CLIENT_SECRET stays a dashboard secret and keep_vars preserves it.
keep_vars = true

[vars]
GITHUB_CLIENT_ID = "Ov23li1TvFCCnO1qJAhp"
ALLOWED_DOMAINS = "ibaimecai.pages.dev"
